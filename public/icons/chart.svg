<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-labelledby="chart-title">
  <title id="chart-title">Dashboard chart icon</title>
  <defs>
    <linearGradient id="chart-gold" x1="4" y1="4" x2="21" y2="22" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6D88A"/>
      <stop offset=".5" stop-color="#D4A843"/>
      <stop offset="1" stop-color="#966115"/>
    </linearGradient>
    <filter id="chart-glow" x="-40%" y="-45%" width="180%" height="190%" color-interpolation-filters="sRGB">
